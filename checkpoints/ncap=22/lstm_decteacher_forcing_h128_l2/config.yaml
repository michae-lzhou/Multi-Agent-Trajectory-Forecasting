model:
  hidden_size: 128
  num_layers: 2
  decoder_input: "teacher_forcing"   # "zero", "last_pred", "teacher_forcing"
  dropout: 0.0

training:
  batch_size: 32
  learning_rate: 1e-3
  num_epochs: 20
  grad_clip: 1.0
  checkpoint_dir: "checkpoints"

data:
  neighbor_cap: 22
  train_dir: "data/processed/train"
  val_dir: "data/processed/val"
